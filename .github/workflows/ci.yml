name: Node.js CI Demo

on:
  push:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Tải mã nguồn về máy ảo
      uses: actions/checkout@v4

    - name: Cài đặt Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Cài đặt thư viện phụ thuộc (Chuẩn CI)
      run: npm ci

    - name: Chạy Unit Test
      run: npx jest